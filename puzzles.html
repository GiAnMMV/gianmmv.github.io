    flex-direction: column;

    overflow: hidden;
    background-color: #ffffff;
    transition: background-color 0.2s ease;

  }

  .puzzle-card:hover {

  .puzzle-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;

  .puzzle-card:hover img {
    transform: scale(1.05);

  .puzzle-card h3 {
    margin: 0.75rem 0 0.25rem 0;

<p><a href="/puzzles/noscript/">Switch to List View</a></p>

<div id="paginator-top"></div>
<div id="sort-manager"></div>
<div id="puzzle-container"></div>
<div id="limit-selector"></div>
<div id="paginator-bottom"></div>

<noscript>
  <meta http-equiv="refresh" content="0;url=/puzzles/noscript/">
</noscript>

<script>
  const puzzles = [];

  function updateURL() {
    const uri = urlParams.toString();
    window.history.replaceState({}, '', window.location.pathname + (uri ? "?" + uri : ""));
  }
  
  function paginate({ current, max }) {
    if (!current || !max) return null;

    current = Math.max(1, Math.min(current, max));

    let prev = current === 1 ? null : current - 1;
    let next = current === max ? null : current + 1;

    if (max <= 9) {
      let items = [];
      for (let i = 1; i <= max; i++) items.push(i);
      return { current, prev, next, items };
    }

    let items = [1];

    let left = Math.max(2, current - 2);
    let right = Math.min(max - 1, current + 2);

    if (current <= 4) {
      right = Math.min(max - 1, 7);
    } else if (current >= max - 3) {
      left = Math.max(2, max - 6);
    }

    if (left === 3) left = 2;
    if (right === max - 2) right = max - 1;

    if (left > 2) {
      items.push('e');
    }

    for (let i = left; i <= right; i++) {
      items.push(i);
    }

    if (right < max - 1) {
      items.push('e');
    }

    items.push(max);

    return { current, prev, next, items };
  }
  
  function updateCards() {
    const container = document.getElementById('puzzle-container') || document.querySelector('main');
    if (!container) return;
    const div = document.createElement("div");
    div.className = "puzzle-grid";
    for (const puzzle of puzzles.slice((page-1) * itemsPerPage, page * itemsPerPage)) {
      const a = document.createElement("a");
      a.className = "puzzle-card";
      a.href = "/puzzles/" + puzzle[0];

      const img = document.createElement("img");
      img.src = puzzle[5];
      img.alt = puzzle[2];
      a.appendChild(img);

      const h3 = document.createElement("h3");
      h3.innerText = puzzle[1];
      a.appendChild(h3);

      const time = document.createElement("time");
      time.dateTime = puzzle[2];
      time.innerText = puzzle[3];
      a.appendChild(time);

      div.appendChild(a);
    }
    container.replaceChildren(div);
    
    const p = document.createElement("p");
    p.innerText = `Showing puzzles ${(page - 1) * itemsPerPage + 1}-${Math.min(page * itemsPerPage, puzzles.length)} of ${puzzles.length}`;
    container.appendChild(p);
  }
  
  function changePage(p) {
    page = p;
    if (p === 1) {
      urlParams.delete("page");
      return;
    }
    urlParams.set("page", p);
  }

  function createPaginationDOM(pagination) {
    const ul = document.createElement('ul');
    ul.className = 'control-bar';
    ul.style.justifyContent = 'center';

    const addItem = (text, newPage, { isActive = false, isDisabled = false } = {}) => {
      const li = document.createElement('li');
      li.className = 'bar-item';
      if (isActive) li.classList.add('active');
      if (isDisabled) li.classList.add('disabled');

      const button = document.createElement('button');
      button.className = 'bar-link';
      button.innerText = text;
      if (newPage) {
        button.addEventListener("click", (e) => {
          changePage(newPage);
          updateURL();
          updateCards();
          updatePagination();
        });
      }

      li.appendChild(button);
      ul.appendChild(li);
    };

    if (pagination.prev !== null) {
      addItem('\u00AB', pagination.prev);
    }

    for (const p of pagination.items) {
      if (p === page) {
        addItem(p, null, { isActive: true });
      } else if (p === "e") {
        addItem('\u2026', null, { isDisabled: true });
      } else {
        addItem(p, p);
      }
    }

    if (pagination.next !== null) {
      addItem('\u00BB', pagination.next);
    }

    return ul;
  }

  function updatePagination() {
    const topPag = document.getElementById('paginator-top') || document.querySelector('main');
    const bottomPag = document.getElementById('paginator-bottom') || document.querySelector('main');
    if (!topPag || !bottomPag) return;
    if (maxPage > 1) {
      const pagination = paginate({ current: page, max: maxPage });
      topPag.replaceChildren(createPaginationDOM(pagination));
      bottomPag.replaceChildren(createPaginationDOM(pagination));
    } else {
      topPag.replaceChildren();
      bottomPag.replaceChildren();
    }
  }
  
  function sortPuzzles() {
    if (sortRule === "name") {
      urlParams.set("sort", sortRule);
      puzzles.sort((a,b) => a[1].localeCompare(b[1]));
    } else if (sortRule === "date") {
      urlParams.delete("sort");
      puzzles.sort((a,b) => a[4] - b[4]);
    }
    
    if (sortOrder === "asc")
      urlParams.set("sort-order", sortOrder);
    else {
      urlParams.delete("sort-order");
      puzzles.reverse();
    }
  }
  
  function changeItemsPerPage(l) {
    itemsPerPage = l;
    maxPage = Math.ceil(puzzles.length / itemsPerPage);
    if (l === Number.MAX_VALUE)
      urlParams.set("limit", "max");
    else if (l === 20)
      urlParams.delete("limit");
    else
      urlParams.set("limit", l);
  }
  
  function updateLimitBar() {
    const container = document.getElementById('limit-selector') || document.querySelector('main');
    if (!container) return;
    
    const generateLimitButton = (v, n=null) => {
      if (n === null) n = v;
      const active = itemsPerPage === v;
    
      const li = document.createElement('li');
      li.className = 'bar-item';
      if (active) li.classList.add('active');
    
      const button = document.createElement('button');
      button.className = 'bar-link';
      button.innerText = n;
      li.appendChild(button);
      button.addEventListener("click", (e) => {
        if (active)
          return;
        changeItemsPerPage(v);
        changePage(1);
        updateURL();
        updateLimitBar();
        updateCards();
        updatePagination();
      });
    
      return li;
    };
    
    const values = [10, 20, 50];
    if (!values.includes(itemsPerPage) && itemsPerPage !== Number.MAX_VALUE) {
      values.push(itemsPerPage);
      values.sort((a,b) => a-b);
    }
    
    container.replaceChildren();
  
    const span = document.createElement("span");
    span.innerText = "Puzzles per page:";
    container.appendChild(span);
  
    const ul = document.createElement("ul");
    ul.className = "control-bar";
    ul.style.justifyContent = "left";
    ul.style.display = "inline-flex";
    container.appendChild(ul);
  
    for (const v of values) {
      ul.appendChild(generateLimitButton(v));
    }
    ul.appendChild(generateLimitButton(Number.MAX_VALUE, "Show All"));
  }

  const urlParams = new URLSearchParams(window.location.search);

  let itemsPerPage = urlParams.get("limit");
  if (itemsPerPage === "max")
    itemsPerPage = Number.MAX_VALUE;
  else
    itemsPerPage = Math.max(parseInt(itemsPerPage), 0) || 20;

  let page = parseInt(urlParams.get("page"));
  if (isNaN(page)) page = 1;
  page = Math.max(page, 1);

  let maxPage;

  let sortRule = urlParams.get("sort");
  if (sortRule !== "date")
    sortRule = "date";
  
  let sortOrder = urlParams.get("sort-order");
  if (sortOrder !== "asc")
    sortOrder = "desc";


  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const response = await fetch("/assets/data/puzzleList.json");

      if (!response.ok)
        throw new Error("Network error: " + response.status);

      puzzles.push(...(await response.json()));
    } catch (error) {
      console.error("Loading error: ", error)
    }

    maxPage = Math.ceil(puzzles.length / itemsPerPage);
    page = Math.min(page, maxPage);

    sortPuzzles();
    updatePagination();
    updateCards();

    {
      const isActive = (p, v) => {
        return (
          (p === "sort" && sortRule === v) ||
          (p === "sort-order" && sortOrder === v)
        );
      }

      const generateSortButton = (p, v, n) => {
        const active = isActive(p, v);

        const li = document.createElement('li');
        li.className = 'bar-item';
        if (active) li.classList.add('active');

        const button = document.createElement('button');
        button.className = 'bar-link';
        button.innerText = n;
        button.addEventListener("click", (e) => {
          if (isActive(p, v))
            return;
          changePage(1);
          if (p === "sort") sortRule = v;
          else if (p === "sort-order") sortOrder = v;
          sortPuzzles();
          updateURL();
          updateCards();
          updatePagination();

          li.parentElement.querySelectorAll('.bar-item').forEach(item => item.classList.remove('active'));
          li.classList.add("active");
        });

        li.appendChild(button);

        return li;
      };

      const mainDiv = document.createElement("div");
      mainDiv.style.display = "flex";
      mainDiv.style.justifyContent = "space-between";
      mainDiv.style.alignItems = "center";
      mainDiv.style.flexWrap = "wrap";
      {
        const subDiv = document.createElement("div");

        const span = document.createElement("span");
        span.innerText = "Sort by";
        subDiv.appendChild(span);

        const ul = document.createElement("ul");
        ul.className = "control-bar";
        ul.style.justifyContent = "left";
        ul.style.display = "inline-flex";
        ul.appendChild(generateSortButton("sort", "date", "Date"));
        ul.appendChild(generateSortButton("sort", "name", "Name"));
        subDiv.appendChild(ul);

        mainDiv.appendChild(subDiv);
      }
      {
        const subDiv = document.createElement("div");

        const span = document.createElement("span");
        span.innerText = "Order:";
        subDiv.appendChild(span);

        const ul = document.createElement("ul");
        ul.className = "control-bar";
        ul.style.justifyContent = "right";
        ul.style.display = "inline-flex";
        ul.appendChild(generateSortButton("sort-order", "asc", "Ascending \u2197"));
        ul.appendChild(generateSortButton("sort-order", "desc", "Descending \u2199"));
        subDiv.appendChild(ul);

        mainDiv.appendChild(subDiv);
      }
      const container = document.getElementById('sort-manager') || document.querySelector('main');
      if (container) container.appendChild(mainDiv);
    }

    updateLimitBar();
  });
</script>
