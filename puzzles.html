permalink: /puzzles/

<head><style>
  /* Card Container Grid */
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }
  
  /* Individual Card Structure */
  .puzzle-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    background-color: #ffffff;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  
  .puzzle-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }
  
  /* Constrain Image Size & Maintain Aspect Ratio */
  .puzzle-card img {
    width: 100%;
    height: 200px;         /* Forces fixed height on gallery cards */
    object-fit: cover;     /* Crops image gracefully without stretching/distorting */
    object-position: center;
    background-color: #f5f5f5;
  }
  
  .puzzle-card h3 {
    margin: 0;
    padding: 1rem;
    font-size: 1.1rem;
    text-align: center;
  }
</style></head>

<body>
  <h1>GiAnMMV's Puzzles</h1>
  
  <div class="puzzle-grid">
    {% for puzzle in site.puzzles %}
      <a href="{{ puzzle.url | relative_url }}" class="puzzle-card">
        <img src="{{ puzzle.image | relative_url }}" alt="{{ puzzle.title }}">
        <h3>{{ puzzle.title }}</h3>
      </a>
    {% endfor %}
  </div>
</body>
