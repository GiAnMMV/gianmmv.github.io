---
layout: default
title: Puzzles
permalink: /puzzles/
---

<style>
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }

  .puzzle-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    background-color: #ffffff;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    padding-bottom: 0.75rem;
  }

  .puzzle-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }

  .puzzle-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    background-color: #f5f5f5;
  }

  .puzzle-card h3 {
    margin: 0.5rem 0 0.25rem 0;
    padding: 0 0.5rem;
    font-size: 1rem;
    text-align: center;
  }

  .puzzle-card time {
    font-size: 0.8rem;
    color: #666666;
    text-align: center;
  }

  .main-content .pagination {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    padding-left: 0;
    list-style: none;
    border-radius: .25rem;
    margin-top: .5rem;
    margin-bottom: .5rem;
    justify-content: center;
  }

  .page-link {
    position: relative;
    display: block;
    padding: .5rem .75rem;
    margin-left: -1px;
    line-height: 1.25;
    background-color: #fff;
    border: 1px solid #dee2e6;
    color: #007bff;
  }

  .page-link:hover{
    color:#0056b3;
    text-decoration: none;
    background-color: #e9ecef;
    border-color: #dee2e6;
  }

  .page-link.active {
    z-index: 1;
    color: #fff;
    background-color: #007bff;
    border-color: #007bff;
  }

  .page-item:last-child .page-link {
    border-top-right-radius: .25rem;
    border-bottom-right-radius: .25rem;
  }
</style>

<h1>GiAnMMV's Puzzles</h1>
<div id="puzzle-container"></div>
<div id="paginator"></div>

<script>
  const puzzles = [
    {% assign sorted_puzzles = site.puzzles | sort: "order" %}
    {% for puzzle in sorted_puzzles %}
      [
        "{{ puzzle.slug }}",
        "{{ puzzle.url }}",
        "{{ puzzle.title}}",
        "{{ puzzle.creation_date }}",
        "{{ puzzle.creation_date | date: "%-d %B %Y" }}"
      ]{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function paginate({ current, max }) {
    if (!current || !max) return null;

    current = Math.max(1, Math.min(current, max));

    let prev = current === 1 ? null : current - 1;
    let next = current === max ? null : current + 1;

    if (max <= 9) {
      let items = [];
      for (let i = 1; i <= max; i++) items.push(i);
      return { current, prev, next, items };
    }

    let items = [1];

    let left = Math.max(2, current - 2);
    let right = Math.min(max - 1, current + 2);

    if (current <= 4) {
      right = Math.min(max - 1, 7);
    } else if (current >= max - 3) {
      left = Math.max(2, max - 6);
    }

    if (left === 3) left = 2;
    if (right === max - 2) right = max - 1;

    if (left > 2) {
      items.push('e');
    }

    for (let i = left; i <= right; i++) {
      items.push(i);
    }

    if (right < max - 1) {
      items.push('e');
    }

    items.push(max);

    return { current, prev, next, items };
  }

  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);

    const itemsPerPage = 20;
    let page = parseInt(urlParams.get("page")) - 1;
    if (isNaN(page)) page = 0;
    page = Math.max(page, 0);
    const maxPage = Math.floor(puzzles.length / itemsPerPage);
    page = Math.min(page, maxPage);

    {
      let html = '<div class="puzzle-grid">';
      for (const puzzle of puzzles.slice(page * itemsPerPage, (page + 1) * itemsPerPage)) {
        html += `
        <a href="${puzzle[1]}" class="puzzle-card">
          <img src="/assets/images/${puzzle[0]}.png" alt="${puzzle[2]}">
            <h3>${puzzle[2]}</h3>
            <time datetime="${puzzle[3]}">${puzzle[4]}</time>
        </a>
      `;
      }
      html += '</div>';

      const container = document.getElementById('puzzle-container') || document.querySelector('main');
      if (container) {
        container.insertAdjacentHTML('beforeend', html);
      }
    }

    if (maxPage !== 1) {
      const pagination = paginate({current: page+1, max: maxPage + 1});
      let html = '<ul class="pagination">';
      if (pagination.prev !== null) {
        html += `<li><a class="page-link" href="?page=${pagination.prev}">&laquo;</a></li>`
      }
      for (const p of pagination.items) {
        if (p === page+1)
          html += `<li><a class="page-link active" href="#">${p}</a></li>`
        else if (p !== "e")
          html += `<li><a class="page-link" href="?page=${p}">${p}</a></li>`
        else
          html += `<li><a class="page-link">&hellip;</a></li>`
      }
      if (pagination.next !== null) {
        html += `<li><a class="page-link" href="?page=${pagination.next}">&raquo;</a></li>`
      }
      html += '</ul>';

      const container = document.getElementById('paginator') || document.querySelector('main');
      if (container) {
        container.insertAdjacentHTML('beforeend', html);
      }
    }
  });
</script>
