---
layout: default
title: Puzzles
permalink: /puzzles/
---
<head><style>
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }
  
  .puzzle-card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    background-color: #ffffff;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  
  .puzzle-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }
  
  .puzzle-card img {
    width: 100%;
    object-fit: cover;
    object-position: center;
    background-color: #f5f5f5;
  }
  
  .puzzle-card h3 {
    margin: 0;
    padding: 1rem;
    font-size: 1.1rem;
    text-align: center;
  }
</style></head>

<body>
  <h1>GiAnMMV's Puzzles</h1>
  
  <div class="puzzle-grid">
    {% assign sorted_puzzles = site.puzzles | sort: "order" %}
    {% for puzzle in sorted_puzzles %}
      <a href="{{ puzzle.url | relative_url }}" class="puzzle-card">
        <img src="{{ puzzle.slug | prepend: '/assets/images/' | append: '.png' | relative_url }}" alt="{{ puzzle.title }}">
        <h3>{{ puzzle.title }}</h3>
      </a>
    {% endfor %}
  </div>
</body>
