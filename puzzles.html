---
layout: default
title: Puzzles
permalink: /puzzles/
---

<style>
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }

  .puzzle-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    border: 1px solid #e0e0e0;
    border-radius: 0 0 .25rem .25rem;
    overflow: hidden;
    background-color: #ffffff;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    padding-bottom: 0.75rem;
  }

  .puzzle-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }

  .puzzle-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    background-color: #f5f5f5;
  }

  .puzzle-card h3 {
    margin: 0.5rem 0 0.25rem 0;
    padding: 0 0.5rem;
    font-size: 1rem;
    text-align: center;
  }

  .puzzle-card time {
    font-size: 0.8rem;
    color: #666666;
    text-align: center;
  }

  .main-content .pagination {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    padding-left: 0;
    list-style: none;
    border-radius: .25rem;
    margin-top: .5rem;
    margin-bottom: .5rem;
    justify-content: center;
  }

  .page-link {
    position: relative;
    display: block;
    padding: .5rem .75rem;
    margin-left: -1px;
    line-height: 1.25;
    background-color: #fff;
    border: 1px solid #dee2e6;
    color: #007bff;
  }

  .page-link:hover{
    color:#0056b3;
    text-decoration: none;
    background-color: #e9ecef;
  }

  .page-item.active .page-link {
    z-index: 1;
    color: #fff;
    background-color: #007bff;
    border-color: #007bff;
  }

  .page-item.disabled .page-link {
    color: #6c757d;
    cursor: pointer;
  }

  .page-item:first-child .page-link {
    border-top-left-radius: .25rem;
    border-bottom-left-radius: .25rem;
  }

  .page-item:last-child .page-link {
    border-top-right-radius: .25rem;
    border-bottom-right-radius: .25rem;
  }

  .btn {
    anchor-name: --my-dropdown-anchor;
    position: relative;
    display: block;
    padding: .5rem .75rem;
    margin-left: -1px;
    line-height: 1.25;
    color: #fff;
    background-color: #007bff;
    border-color: #007bff;
    cursor: pointer;
    border-radius: .25rem;
    margin-top: .5rem;
    margin-bottom: .5rem;
  }

  .btn:hover {
    background-color: #0056b3;
    border-color: #0056b3;
  }

  .dropdown-toggle::after {
    display: inline-block;
    width: 0;
    height: 0;
    margin-left: .255em;
    vertical-align: .255em;
    content: "";
    border-top: .3em solid;
    border-right: .3em solid transparent;
    border-bottom: 0;
    border-left: .3em solid transparent;
  }

  #my-menu:popover-open {
    position-anchor: --my-dropdown-anchor;

    position: absolute;
    top: 100%;
    left: 0;
    z-index: 1000;
    float: left;
    min-width: 10rem;
    padding: .5rem 0;
    margin: .5rem .5rem 0;
    font-size: 1rem;
    color: #212529;
    text-align: left;
    list-style: none;
    background-color: #fff;
    background-clip: padding-box;
    border: 1px solid rgba(0,0,0,.15);
    border-radius: .25rem;
    overflow-x: hidden;
    transform: translate3d(0px, 38px, 0px);
    top: 0px; left: 0px;
    will-change: transform;
  }

  .dropdown-item {
    display: block;
    width: 100%;
    padding: .25rem 1.5rem;
    clear: both;
    font-weight: 400;
    color: #212529;
    text-align: inherit;
    white-space: nowrap;
    background-color: transparent;
    border: 0;
  }

  .dropdown-item:hover {
    background-color: #e9ecef;
  }

  .dropdown-divider {
    height: 0;
    margin: .5rem 0;
    overflow: hidden;
    border-top: 1px solid #e9ecef;
  }
</style>

<h1>GiAnMMV's Puzzles</h1>
<div id="paginator-top"></div>

<div id="dropdown"></div>

<div id="puzzle-container"></div>
<div id="paginator-bottom"></div>

<noscript>
  <meta http-equiv="refresh" content="0;url=/puzzles/noscript/">
</noscript>

<script>
  const puzzles = [
    {% assign sorted_puzzles = site.puzzles | sort: "order" %}
    {% for puzzle in sorted_puzzles %}
      [
        "{{ puzzle.slug }}",
        "{{ puzzle.url }}",
        "{{ puzzle.title}}",
        "{{ puzzle.creation_date }}",
        "{{ puzzle.creation_date | date: "%-d %B %Y" }}"
      ]{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function paginate({ current, max }) {
    if (!current || !max) return null;

    current = Math.max(1, Math.min(current, max));

    let prev = current === 1 ? null : current - 1;
    let next = current === max ? null : current + 1;

    if (max <= 9) {
      let items = [];
      for (let i = 1; i <= max; i++) items.push(i);
      return { current, prev, next, items };
    }

    let items = [1];

    let left = Math.max(2, current - 2);
    let right = Math.min(max - 1, current + 2);

    if (current <= 4) {
      right = Math.min(max - 1, 7);
    } else if (current >= max - 3) {
      left = Math.max(2, max - 6);
    }

    if (left === 3) left = 2;
    if (right === max - 2) right = max - 1;

    if (left > 2) {
      items.push('e');
    }

    for (let i = left; i <= right; i++) {
      items.push(i);
    }

    if (right < max - 1) {
      items.push('e');
    }

    items.push(max);

    return { current, prev, next, items };
  }

  document.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);

    const itemsPerPage = Math.min(Math.max(
        parseInt(urlParams.get("limit")), 0
      ) || 20, 1000);
    let page = parseInt(urlParams.get("page")) - 1;
    if (isNaN(page)) page = 0;
    page = Math.max(page, 0);
    const maxPage = Math.ceil(puzzles.length / itemsPerPage) - 1;
    page = Math.min(page, maxPage);

    const sortRule = urlParams.get("sort");
    if (sortRule === "name") {
      puzzles.sort((a,b) => (a[2] > b[2]) ? 1 : ((b[2] > a[2]) ? -1 : 0));
    }

    const sortOrder = urlParams.get("sort-order") === 'desc';
    if (sortOrder) puzzles.reverse();

    {
      let html = '<div class="puzzle-grid">';
      for (const puzzle of puzzles.slice(page * itemsPerPage, (page + 1) * itemsPerPage)) {
        html += `
        <a href="${puzzle[1]}" class="puzzle-card">
          <img src="/assets/images/${puzzle[0]}.png" alt="${puzzle[2]}">
            <h3>${puzzle[2]}</h3>
            <time datetime="${puzzle[3]}">${puzzle[4]}</time>
        </a>
      `;
      }
      html += '</div>';

      const container = document.getElementById('puzzle-container') || document.querySelector('main');
      if (container)
        container.insertAdjacentHTML('beforeend', html);
    }

    if (maxPage !== 1) {
      const pagination = paginate({current: page+1, max: maxPage+1});
      let html = '<ul class="pagination">';
      if (pagination.prev !== null) {
        urlParams.set("page", pagination.prev);
        html += `<li class="page-item"><a class="page-link" href="?${urlParams.toString()}">&laquo;</a></li>`;
      }
      for (const p of pagination.items) {
        if (p === page+1)
          html += `<li class="page-item active"><a class="page-link" href="#">${p}</a></li>`;
        else if (p === "e")
          html += '<li class="page-item disabled"><a class="page-link">&hellip;</a></li>';
        else {
          urlParams.set("page", p);
          html += `<li class="page-item"><a class="page-link" href="?${urlParams.toString()}">${p}</a></li>`;
        }
          
      }
      if (pagination.next !== null) {
        urlParams.set("page", pagination.next);
        html += `<li class="page-item"><a class="page-link" href="?${urlParams.toString()}">&raquo;</a></li>`;
      }
      html += '</ul>';

      const topPag = document.getElementById('paginator-top') || document.querySelector('main');
      if (topPag) topPag.insertAdjacentHTML('beforeend', html);

      const bottomPag = document.getElementById('paginator-bottom') || document.querySelector('main');
      if (bottomPag) bottomPag.insertAdjacentHTML('beforeend', html);

      urlParams.set("page", page+1);
    }

    {
      const setParam = (p, v) => {
        const sp = new URLSearchParams(urlParams);
        sp.set(p, v);
        sp.delete("page");
        return sp.toString()
      };
      var html = `
        <p style="display: flex;justify-content: space-between;">
          <div>
            <span>Sort by</span>
            <ul class="pagination" style="justify-content: left;display: inline-flex;">
              <li class="page-item${sortRule !== "name" ? " active" : ""}"><a class="page-link" href="?${setParam("sort", "date")}">Date</a></li>
              <li class="page-item${sortRule === "name" ? " active" : ""}"><a class="page-link" href="?${setParam("sort", "name")}">Name</a></li>
            </ul>
          </div>
          <div>
            <span>Order:</span>
            <ul class="pagination" style="justify-content: left;display: inline-flex;">
              <li class="page-item${!sortOrder ? " active" : ""}"><a class="page-link" href="?${setParam("sort-order", "asc")}">Ascending &nearr;</a></li>
              <li class="page-item${sortOrder ? " active" : ""}"><a class="page-link" href="?${setParam("sort-order", "desc")}">Descending &swarr;</a></li>
            </ul>
          </div>
        </p>
      `;
      const container = document.getElementById('dropdown') || document.querySelector('main');
      if (container) container.insertAdjacentHTML('beforeend', html);
    }
  });
</script>
