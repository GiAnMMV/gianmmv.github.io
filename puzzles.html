---
layout: default
title: Puzzles
permalink: /puzzles/
---

<style>
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }

  .puzzle-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    background-color: #ffffff;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    padding-bottom: 0.75rem;
  }

  .puzzle-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }

  .puzzle-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    background-color: #f5f5f5;
  }

  .puzzle-card h3 {
    margin: 0.5rem 0 0.25rem 0;
    padding: 0 0.5rem;
    font-size: 1rem;
    text-align: center;
  }

  .puzzle-card time {
    font-size: 0.8rem;
    color: #666666;
    text-align: center;
  }
</style>

<h1>GiAnMMV's Puzzles</h1>

<script>
  const puzzleSlugs = {
    {% assign sorted_puzzles = site.puzzles | sort: "order" %}
    {% for puzzle in sorted_puzzles %}
      "{{ puzzle.slug }}": [
        "{{ puzzle.url }}",
        "{{ puzzle.title}}",
        "{{ puzzle.creation_date }}",
        "{{ puzzle.creation_date | date: "%-d %B %Y" }}"
      ]{% unless forloop.last %},{% endunless %}
    {% endfor %}
  };
  document.body.innerHTML += '<div class="puzzle-grid">'
  for (const slug of Object.keys(puzzleSlugs)) {
    document.body.innerHTML += `
      <a href="${puzzleSlugs[slug][0]}" class="puzzle-card">
        <img src="/assets/images/${slug}.png" alt="${puzzleSlugs[slug][1]}">
          <h3>${puzzleSlugs[slug][1]}</h3>
          <time datetime="${puzzleSlugs[slug][2]}">${puzzleSlugs[slug][3]}</time>
      </a>
    `;
  }
  document.body.innerHTML += '</div>'
</script>
