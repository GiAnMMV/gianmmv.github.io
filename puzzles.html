---
layout: default
title: Puzzles
permalink: /puzzles/
---

<style>
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 1.5rem;
    margin-top: 1.5rem;
  }

  .puzzle-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: inherit;
    border: 1px solid #e0e0e0;
    border-radius: 0 0 .25rem .25rem;
    overflow: hidden;
    background-color: #ffffff;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    padding-bottom: 0.75rem;
  }

  .puzzle-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
  }

  .puzzle-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: contain;
    object-position: center;
    background-color: #f5f5f5;
  }

  .puzzle-card h3 {
    margin: 0.5rem 0 0.25rem 0;
    padding: 0 0.5rem;
    font-size: 1rem;
    text-align: center;
  }

  .puzzle-card time {
    font-size: 0.8rem;
    color: #666666;
    text-align: center;
  }

  .main-content .control-bar {
    display: -webkit-box;
    display: -ms-flexbox;
    display: flex;
    padding-left: 0;
    list-style: none;
    border-radius: .25rem;
    margin-top: .5rem;
    margin-bottom: .5rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
    padding-bottom: 0.5rem;
  }

  .bar-link {
    position: relative;
    display: block;
    padding: .5rem .75rem;
    margin-left: -1px;
    line-height: 1.25;
    background-color: #fff;
    border: 1px solid #dee2e6;
    color: #007bff;
  }

  .bar-link:hover{
    color:#0056b3;
    text-decoration: none;
    background-color: #e9ecef;
  }

  .bar-item.active .bar-link {
    z-index: 1;
    color: #fff;
    background-color: #007bff;
    border-color: #007bff;
  }

  .bar-item.disabled .bar-link {
    color: #6c757d;
    cursor: pointer;
  }

  .bar-item:first-child .bar-link {
    border-top-left-radius: .25rem;
    border-bottom-left-radius: .25rem;
  }

  .bar-item:last-child .bar-link {
    border-top-right-radius: .25rem;
    border-bottom-right-radius: .25rem;
  }
</style>

<h1>GiAnMMV's Puzzles</h1>
<div id="paginator-top"></div>
<div id="sort-manager"></div>
<div id="puzzle-container"></div>
<div id="limit-selector"></div>
<div id="paginator-bottom"></div>

<noscript>
  <meta http-equiv="refresh" content="0;url=/puzzles/noscript/">
</noscript>

<script>
  const puzzles = [
    {% assign sorted_puzzles = site.puzzles | sort: "order" %}
    {% for puzzle in sorted_puzzles %}
      [
        "{{ puzzle.slug }}",
        "{{ puzzle.url }}",
        "{{ puzzle.title}}",
        "{{ puzzle.creation_date }}",
        "{{ puzzle.creation_date | date: "%-d %B %Y" }}",
        {{ puzzle.order }}
      ]{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
  function paginate({ current, max }) {
    if (!current || !max) return null;

    current = Math.max(1, Math.min(current, max));

    let prev = current === 1 ? null : current - 1;
    let next = current === max ? null : current + 1;

    if (max <= 9) {
      let items = [];
      for (let i = 1; i <= max; i++) items.push(i);
      return { current, prev, next, items };
    }

    let items = [1];

    let left = Math.max(2, current - 2);
    let right = Math.min(max - 1, current + 2);

    if (current <= 4) {
      right = Math.min(max - 1, 7);
    } else if (current >= max - 3) {
      left = Math.max(2, max - 6);
    }

    if (left === 3) left = 2;
    if (right === max - 2) right = max - 1;

    if (left > 2) {
      items.push('e');
    }

    for (let i = left; i <= right; i++) {
      items.push(i);
    }

    if (right < max - 1) {
      items.push('e');
    }

    items.push(max);

    return { current, prev, next, items };
  }
  
  function updateCards() {
    const div = document.createElement("div");
    div.className = "puzzle-grid";
    for (const puzzle of puzzles.slice((page-1) * itemsPerPage, page * itemsPerPage)) {
      const a = document.createElement("a");
      a.className = "puzzle-card";
      a.href = puzzle[1];

      const img = document.createElement("img");
      img.src = "/assets/images/" + puzzle[0] + ".png";
      img.alt = puzzle[2];
      a.appendChild(img);

      const h3 = document.createElement("h3");
      h3.innerText = puzzle[2];
      a.appendChild(h3);

      const time = document.createElement("time");
      time.dateTime = puzzle[3];
      time.innerText = puzzle[4];
      a.appendChild(time);

      div.appendChild(a);
    }
    const container = document.getElementById('puzzle-container') || document.querySelector('main');
      if (container)
        container.replaceChildren(div);
  }
  
  function changePage(p) {
    page = p;
    if (p === 1) {
      urlParams.delete("page");
      return;
    }
    urlParams.set("page", p);
  }

  function createPaginationDOM(pagination) {
    const ul = document.createElement('ul');
    ul.className = 'control-bar';
    ul.style.justifyContent = 'center';

    const addItem = (text, newPage, { isActive = false, isDisabled = false } = {}) => {
      const li = document.createElement('li');
      li.className = 'bar-item';
      if (isActive) li.classList.add('active');
      if (isDisabled) li.classList.add('disabled');

      const button = document.createElement('button');
      button.className = 'bar-link';
      button.innerText = text;
      if (newPage) {
        button.addEventListener("click", (e) => {
          changePage(newPage);
          window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
          updateCards();
          updatePagination();
        });
      }

      li.appendChild(button);
      ul.appendChild(li);
    };

    if (pagination.prev !== null) {
      addItem('\u00AB', pagination.prev);
    }

    for (const p of pagination.items) {
      if (p === page) {
        addItem(p, null, { isActive: true });
      } else if (p === "e") {
        addItem('\u2026', null, { isDisabled: true });
      } else {
        addItem(p, p);
      }
    }

    if (pagination.next !== null) {
      addItem('\u00BB', pagination.next);
    }

    return ul;
  }

  function updatePagination() {
    const topPag = document.getElementById('paginator-top') || document.querySelector('main');
    const bottomPag = document.getElementById('paginator-bottom') || document.querySelector('main');
    if (maxPage > 1) {
      const pagination = paginate({ current: page, max: maxPage });

      if (topPag)
        topPag.replaceChildren(createPaginationDOM(pagination));

      if (bottomPag)
        bottomPag.replaceChildren(createPaginationDOM(pagination));
    } else {
      if (topPag)
        topPag.replaceChildren();
      
      if (bottomPag)
        bottomPag.replaceChildren();
    }
  }
  
  function sortPuzzles() {
    if (sortRule === "name") {
      urlParams.set("sort", sortRule);
      puzzles.sort();
    } else if (sortRule === "date") {
      urlParams.delete("sort");
      puzzles.sort((a,b) => a[5] - b[5]);
    }
    
    if (sortOrder === "asc") {
      urlParams.set("sort-order", sortOrder);
    else {
      urlParams.delete("sort-order");
      puzzles.reverse();
    }
  }
  
  function changeItemsPerPage(l) {
    itemsPerPage = l;
    maxPage = Math.ceil(puzzles.length / itemsPerPage);
    if (l === Number.MAX_VALUE)
      urlParams.set("limit", "max");
    else if (l === 20)
      urlParams.delete("limit");
    else
      urlParams.set("limit", l);
  }
  
  function updateLimitBar() {
    const generateLimitButton = (v, n=null) => {
      if (n === null) n = v;
      const active = itemsPerPage === v;
    
      const li = document.createElement('li');
      li.className = 'bar-item';
      if (active) li.classList.add('active');
    
      const button = document.createElement('button');
      button.className = 'bar-link';
      button.innerText = n;
      li.appendChild(button);
      button.addEventListener("click", (e) => {
        if (active)
          return;
        changeItemsPerPage(v);
        changePage(1);
        window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
        updateLimitBar();
        updateCards();
        updatePagination();
      });
    
      return li;
    };
    const values = [10, 20, 50];
    if (!values.includes(itemsPerPage) && itemsPerPage !== Number.MAX_VALUE) {
      values.push(itemsPerPage);
      values.sort((a,b) => a-b);
    }

    const container = document.getElementById('limit-selector') || document.querySelector('main');
    if (!container) return;
    
    container.replaceChildren();
  
    const span = document.createElement("span");
    span.innerText = "Puzzles per page:";
    container.appendChild(span);
  
    const ul = document.createElement("ul");
    ul.className = "control-bar";
    ul.style.justifyContent = "left";
    ul.style.display = "inline-flex";
    container.appendChild(ul);
  
    for (const v of values) {
      ul.appendChild(generateLimitButton(v));
    }
    ul.appendChild(generateLimitButton(Number.MAX_VALUE, "Show All"));
  }

  let urlParams
  let itemsPerPage, page, maxPage
  let sortRule, sortOrder
  document.addEventListener("DOMContentLoaded", () => {
    urlParams = new URLSearchParams(window.location.search);

    itemsPerPage = urlParams.get("limit");
    if (itemsPerPage === "max")
      itemsPerPage = Number.MAX_VALUE;
    else
      itemsPerPage = Math.max(parseInt(itemsPerPage), 0) || 20;

    page = parseInt(urlParams.get("page"));
    if (isNaN(page)) page = 1;
    page = Math.max(page, 1);
    maxPage = Math.ceil(puzzles.length / itemsPerPage);
    page = Math.min(page, maxPage);

    sortRule = urlParams.get("sort");
    if (sortRule !== "date")
      sortRule = "date";

    sortOrder = urlParams.get("sort-order");
    if (sortOrder !== "asc") {
      sortOrder = "desc";
    }
    sortPuzzles();
    
    updatePagination();
    updateCards();

    {
      const isActive = (p, v) => {
        return (
          (p === "sort" && sortRule === v) ||
          (p === "sort-order" && sortOrder === v)
        );
      }

      const generateSortButton = (p, v, n) => {
        const active = isActive(p, v);
        
        const li = document.createElement('li');
        li.className = 'bar-item';
        if (active) li.classList.add('active');
        
        const button = document.createElement('button');
        button.className = 'bar-link';
        button.innerText = n;
        button.addEventListener("click", (e) => {
          if (isActive(p,v))
            return;
          changePage(1);
          if (p === "sort") sortRule = v;
          else if (p === "sort-order") sortOrder = v;
          sortPuzzles();
          window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
          updateCards();
          updatePagination();
          
          li.parentElement.querySelectorAll('.bar-item').forEach(item => item.classList.remove('active'));
          li.classList.add("active");
        });
        
        li.appendChild(button);
        
        return li;
      };
      
      const mainDiv = document.createElement("div");
      mainDiv.style.display = "flex";
      mainDiv.style.justifyContent = "space-between";
      mainDiv.style.alignItems = "center";
      mainDiv.style.flexWrap = "wrap";
      {
        const subDiv = document.createElement("div");
        
        const span = document.createElement("span");
        span.innerText = "Sort by";
        subDiv.appendChild(span);
        
        const ul = document.createElement("ul");
        ul.className = "control-bar";
        ul.style.justifyContent = "left";
        ul.style.display = "inline-flex";
        ul.appendChild(generateSortButton("sort", "date", "Date"));
        ul.appendChild(generateSortButton("sort", "name", "Name"));
        subDiv.appendChild(ul);
        
        mainDiv.appendChild(subDiv);
      }
      {
        const subDiv = document.createElement("div");
        
        const span = document.createElement("span");
        span.innerText = "Order:";
        subDiv.appendChild(span);
        
        const ul = document.createElement("ul");
        ul.className = "control-bar";
        ul.style.justifyContent = "right";
        ul.style.display = "inline-flex";
        ul.appendChild(generateSortButton("sort-order", "asc", "Ascending \u2197"));
        ul.appendChild(generateSortButton("sort-order", "desc", "Descending \u2199"));
        subDiv.appendChild(ul);
        
        mainDiv.appendChild(subDiv);
      }
      const container = document.getElementById('sort-manager') || document.querySelector('main');
      if (container) container.appendChild(mainDiv);
    }
    
    updateLimitBar();
  });
</script>
