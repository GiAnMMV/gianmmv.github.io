<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting to SudokuPad...</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #f9f9f9;
      color: #333;
    }
  </style>
</head>
<body>
  <p id="status-text">Loading puzzle in SudokuPad...</p>

  <script src="{{ '/assets/js/puzzle-converter.js' | relative_url }}"></script>
  <script>
    async function getShortLink(jsonData) {
      try {
        const response = await fetch('https://sudokupad.app/admin/createlink', {
          method: 'POST',
          body: '{"puzzle":"' + getPuzzleId(jsonData) + '"}'
        })
        const data = await response.json();
        if (data.result === "success" && data.shortid)
          return "https://sudokupad.app/" + data.shortid;
        else
          throw new Error("No response from SudokuPad API.");
      } catch (err) {
        throw new Error("Failed to generate short URL:", err);
      }
    }


    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const puzzleSlug = urlParams.get('puzzle') || urlParams.get('p');

      if (!puzzleSlug) {
        document.getElementById("status-text").innerText = "No puzzle specified.";
        return;
      }

      const jsonPath = `{{ '/assets/data/puzzles/' | relative_url }}${puzzleSlug}.json`;

      fetch(jsonPath)
        .then(res => {
          if (!res.ok) throw new Error("Puzzle file not found");
          return res.json();
        })
        .then(data => {
          if (urlParams.get('no-short') === '1') {
            const targetUrl = convertJsonToUrlNoShort(data);
            if (targetUrl) {
              window.location.href = targetUrl;
            } else {
              document.getElementById("status-text").innerText = "Puzzle link generation failed.";
            }
          } else {
            getShortLink(data)
              .then(link => {window.location.href = link;})
              .catch(err => {
                console.error(err);
                document.getElementById("status-text").innerText = err.toString();
              });
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById("status-text").innerText = "Error loading puzzle data.";
        });
    });
  </script>
</body>
</html>
