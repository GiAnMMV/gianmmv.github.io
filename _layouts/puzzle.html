---
layout: default
---

<article class="project-detail">
  <h1>{{ page.title }}</h1>
  {% if page.image %}
    <img src="{{ page.image | relative_url }}" alt="{{ page.title }}">
  {% endif %}

  <h2>Rules:</h2>
  <ul>
  {% for rule in page.rules %}
    <li><strong>{{ rule.name }}:</strong> {{ rule.desc }}</li>
  {% endfor %}
  </ul>
  {% if page.sudokupad %}
    <p>Play in online in <a href="{{ page.sudokupad }}" target="_blank" class="btn">Sudokupad</a>.</p>
  {% endif %}
  <div class="content">
    {{ content }}
  </div>
</article>
